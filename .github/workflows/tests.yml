name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5433
      DB_NAME: shop_test
      DB_USER: shop_test
      DB_PASSWORD: shop_test
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6380
      REDIS_DB: 0

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: shop_test
          POSTGRES_USER: shop_test
          POSTGRES_PASSWORD: shop_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U shop_test -d shop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq5

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Check lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format . --check

      - name: Apply migrations
        run: python -m alembic upgrade head

      - name: Run tests
        run: python -m pytest -q